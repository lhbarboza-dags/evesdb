server:
  port: ${PORT:8080}   # Render and similar platforms inject PORT
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # true behind HTTPS (deploy/compose.prod.yml)
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}   # required; checked at startup by RequiredEnvCheck
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: true            # same as the legacy OpenEntityManagerInViewFilter
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}   # never alter the shared schema
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQL10Dialect
      hibernate.jdbc.lob.non_contextual_creation: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Fail within 10 s instead of hanging the request when SMTP is blocked or slow
      # (Render's free tier blocks ports 25/465/587; use 2525, see deploy/README-FREE.md B7).
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:sibol.eves.dev@gmail.com}
    enabled: ${MAIL_ENABLED:true}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:true}
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret: ${RECAPTCHA_SECRET:}
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    daily-limit: ${MAPS_DAILY_LIMIT:250}   # app-side map loads/day; keep below the Google Cloud quota (B7)
  legacy-aes:
    secret: ${LEGACY_AES_SECRET}
    salt: ${LEGACY_AES_SALT}
  auth:
    upgrade-hash: ${APP_AUTH_UPGRADE_HASH:false}

management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
  health.mail.enabled: false   # SMTP problems must not mark the API unhealthy
