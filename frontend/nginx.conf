# Keep the scheme set by an outer TLS proxy (Caddy in production); fall back to this hop's scheme locally.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  # API (Spring Boot). Same origin → JSESSIONID + XSRF-TOKEN cookies work without CORS.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 120s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static manual / images.
  location ~ ^/(manual|img)/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback (React Router), including legacy *.zul links that the router redirects.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
